apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: investment-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: investment-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ── ArgoCD Image Updater (opsiyonel) ──────────────────────────────────────
    # Docker Hub'daki yeni tag'leri otomatik algılar.
    # Kurulum: kubectl apply -n argocd -f \
    #   https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/stable/manifests/install.yaml
    argocd-image-updater.argoproj.io/image-list: >-
      backend=docker.io/firataydincak/investor-backend,
      frontend=docker.io/firataydincak/investor-frontend

    argocd-image-updater.argoproj.io/backend.update-strategy: semver
    argocd-image-updater.argoproj.io/frontend.update-strategy: semver

    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^v[0-9]+\.[0-9]+.*$
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^v[0-9]+\.[0-9]+.*$

    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main

    argocd-image-updater.argoproj.io/backend.helm.image-name: backend.image.repository
    argocd-image-updater.argoproj.io/backend.helm.image-tag:  backend.image.tag
    argocd-image-updater.argoproj.io/frontend.helm.image-name: frontend.image.repository
    argocd-image-updater.argoproj.io/frontend.helm.image-tag:  frontend.image.tag

spec:
  project: default

  source:
    repoURL: https://github.com/aydincakfirat/investor-app.git
    targetRevision: main
    path: helm/investment-platform

    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: investment-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/currentReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates

  info:
    - name: "Repo"
      value: "https://github.com/aydincakfirat/investor-app"
    - name: "Backend Image"
      value: "docker.io/firataydincak/investor-backend:v1"
    - name: "Frontend Image"
      value: "docker.io/firataydincak/investor-frontend:v1"
