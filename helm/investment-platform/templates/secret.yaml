{{- /*
Secret template.

IMPORTANT: This template creates a Kubernetes Secret from Helm values.
This is acceptable when secrets are injected at deploy time via:
  helm upgrade --set secrets.databasePassword=<value>
  or an external secrets operator (Vault, ESO, Sealed Secrets).

NEVER commit real secret values in values.yaml or values-prod.yaml.

Future migration path to External Secrets Operator:
  1. Set each secrets.* value to empty string in values.yaml.
  2. Create ExternalSecret CRs pointing to your secrets backend.
  3. Reference the same Secret name in deployments — no deployment changes needed.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "investment-platform.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "investment-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Database passwords ────────────────────────────────────────────────────────
  # Used by backend DATABASE_URL and n8n DB_POSTGRESDB_PASSWORD
  postgresql-password:       {{ .Values.secrets.databasePassword | quote }}
  postgresql-postgres-password: {{ .Values.secrets.postgresPassword | quote }}

  # ── Backend secrets ───────────────────────────────────────────────────────────
  INTERNAL_API_KEY:    {{ .Values.secrets.internalApiKey | quote }}
  OPENAI_API_KEY:      {{ .Values.secrets.openaiApiKey | quote }}
  MARKET_DATA_API_KEY: {{ .Values.secrets.marketDataApiKey | quote }}
  NEWS_API_KEY:        {{ .Values.secrets.newsApiKey | quote }}

  # ── n8n secrets ───────────────────────────────────────────────────────────────
  N8N_ENCRYPTION_KEY:       {{ .Values.secrets.n8nEncryptionKey | quote }}
  DB_POSTGRESDB_PASSWORD:   {{ .Values.secrets.databasePassword | quote }}
