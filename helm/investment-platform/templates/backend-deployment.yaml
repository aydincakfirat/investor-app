{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "investment-platform.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "investment-platform.componentLabels" (dict "component" "backend" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "investment-platform.selectorLabels" (dict "component" "backend" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "investment-platform.componentLabels" (dict "component" "backend" "context" .) | nindent 8 }}
      annotations:
        # Force pod restart when ConfigMap or Secret changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "investment-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        runAsNonRoot: {{ .Values.backend.securityContext.runAsNonRoot }}
        runAsUser:    {{ .Values.backend.securityContext.runAsUser }}
        runAsGroup:   {{ .Values.backend.securityContext.runAsGroup }}
        fsGroup:      {{ .Values.backend.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault

      # Wait for PostgreSQL to be reachable before starting the backend.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "investment-platform.databaseHost" . }} {{ include "investment-platform.databasePort" . }}; do
                echo "Waiting for PostgreSQL..."; sleep 3;
              done
              echo "PostgreSQL is ready."
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: backend
          image: {{ include "investment-platform.image" .Values.backend.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          securityContext:
            runAsNonRoot:             {{ .Values.backend.securityContext.runAsNonRoot }}
            runAsUser:                {{ .Values.backend.securityContext.runAsUser }}
            runAsGroup:               {{ .Values.backend.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.backend.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem:   {{ .Values.backend.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toYaml .Values.backend.securityContext.capabilities.drop | nindent 16 }}

          envFrom:
            - configMapRef:
                name: {{ include "investment-platform.fullname" . }}-config
          env:
            # DATABASE_URL is fully resolved at Helm template time for the static
            # parts (host, port, dbname, user) and at pod start time for the
            # password (via secretKeyRef). This avoids relying on cross-source
            # $(VAR) substitution which does not work between envFrom and env.
            - name: _DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "investment-platform.fullname" . }}-postgresql
                  key: password
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ include "investment-platform.databaseUser" . }}:$(_DB_PASS)@{{ include "investment-platform.databaseHost" . }}:{{ include "investment-platform.databasePort" . }}/{{ include "investment-platform.databaseName" . }}"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "investment-platform.fullname" . }}-secrets
                  key: INTERNAL_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "investment-platform.fullname" . }}-secrets
                  key: OPENAI_API_KEY
            - name: MARKET_DATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "investment-platform.fullname" . }}-secrets
                  key: MARKET_DATA_API_KEY
            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "investment-platform.fullname" . }}-secrets
                  key: NEWS_API_KEY

          # Writable tmp dir for uvicorn worker temp files (readOnlyRootFilesystem=true)
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.startup.initialDelaySeconds }}
            periodSeconds:       {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold:    {{ .Values.backend.probes.startup.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds:      {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold:    {{ .Values.backend.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds:      {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold:    {{ .Values.backend.probes.readiness.failureThreshold }}

      volumes:
        - name: tmp
          emptyDir: {}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "investment-platform.selectorLabels" (dict "component" "backend" "context" .) | nindent 14 }}
{{- end }}
