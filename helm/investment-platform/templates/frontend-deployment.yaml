{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "investment-platform.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "investment-platform.componentLabels" (dict "component" "frontend" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "investment-platform.selectorLabels" (dict "component" "frontend" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "investment-platform.componentLabels" (dict "component" "frontend" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "investment-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        runAsNonRoot: {{ .Values.frontend.securityContext.runAsNonRoot }}
        runAsUser:    {{ .Values.frontend.securityContext.runAsUser }}
        runAsGroup:   {{ .Values.frontend.securityContext.runAsGroup }}
        fsGroup:      {{ .Values.frontend.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: {{ include "investment-platform.image" .Values.frontend.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

          securityContext:
            runAsNonRoot:             {{ .Values.frontend.securityContext.runAsNonRoot }}
            runAsUser:                {{ .Values.frontend.securityContext.runAsUser }}
            runAsGroup:               {{ .Values.frontend.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.frontend.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem:   {{ .Values.frontend.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toYaml .Values.frontend.securityContext.capabilities.drop | nindent 16 }}
              add:  {{ toYaml .Values.frontend.securityContext.capabilities.add | nindent 16 }}

          # nginx needs a writable cache and pid directory
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.frontend.probes.liveness.periodSeconds }}

          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.frontend.probes.readiness.periodSeconds }}

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "investment-platform.selectorLabels" (dict "component" "frontend" "context" .) | nindent 14 }}
{{- end }}
