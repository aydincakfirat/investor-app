{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "investment-platform.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "investment-platform.componentLabels" (dict "component" "backend" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "investment-platform.selectorLabels" (dict "component" "backend" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
