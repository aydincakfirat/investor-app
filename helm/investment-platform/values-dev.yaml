# ── values-dev.yaml ───────────────────────────────────────────────────────────
# Local geliştirme ortamı — minimum kaynak kullanımı.
# Tek replica, düşük CPU/memory, HPA kapalı, debug logging.

global:
  namespace: investment-platform
  imagePullPolicy: Always

backend:
  replicaCount: 1
  image:
    registry: docker.io
    repository: firataydincak/investor-backend
    tag: "v7"
  env:
    LOG_LEVEL: "DEBUG"
    ENVIRONMENT: "development"
    DEBUG: "true"
    AI_PROVIDER: "mock"
    MARKET_DATA_PROVIDER: "yahoo"
    NEWS_PROVIDER: "mock"
  corsOrigins: '["http://localhost:3000","http://localhost:5173"]'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  autoscaling:
    enabled: false

frontend:
  replicaCount: 1
  image:
    registry: docker.io
    repository: firataydincak/investor-frontend
    tag: "v6"
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  autoscaling:
    enabled: false

n8n:
  replicaCount: 1
  image:
    registry: docker.io
    repository: n8nio/n8n
    tag: "1.44.1"
  env:
    N8N_LOG_LEVEL: "info"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    N8N_TEMPLATES_ENABLED: "true"
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    N8N_HIRING_BANNER_ENABLED: "false"
    N8N_METRICS: "false"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  enabled: true
  auth:
    username: investuser
    database: investdb
  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""    # cluster default (k3s: local-path)
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    initdb:
      scripts:
        create-n8n-db.sql: |
          CREATE DATABASE n8n;
          GRANT ALL PRIVILEGES ON DATABASE n8n TO investuser;
  metrics:
    enabled: false

ingress:
  enabled: false    # port-forward kullan

networkPolicy:
  enabled: false    # local'de gereksiz
