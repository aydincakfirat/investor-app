# ── values-dev.yaml ───────────────────────────────────────────────────────────
# Development environment overrides.
# Lower resources, debug logging, no ingress TLS, single replicas.

global:
  namespace: investment-platform-dev
  imagePullPolicy: Always   # always pull so local pushes are picked up

backend:
  replicaCount: 1
  image:
    tag: "dev"
  env:
    LOG_LEVEL: "DEBUG"
    ENVIRONMENT: "development"
    DEBUG: "true"
    AI_PROVIDER: "mock"
    MARKET_DATA_PROVIDER: "mock"
    NEWS_PROVIDER: "mock"
  corsOrigins: "http://localhost:3000,http://localhost:5173"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false

frontend:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  autoscaling:
    enabled: false

n8n:
  image:
    tag: "1.44.1"
  env:
    N8N_LOG_LEVEL: "debug"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  primary:
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: invest.dev.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  n8n:
    enabled: true
    host: n8n.dev.local
  tls: []   # no TLS in dev

networkPolicy:
  enabled: false   # relaxed for development debugging
